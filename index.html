<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Licra Games Bank</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>🎮 Licra Games Bank</h1>

  <div class="bank">
    <p>User: <span id="username"></span></p>
    <p>Balance: <span id="balance"></span> Licra K$</p>
    <p>Value: <span id="value"></span></p>

    <button onclick="earnLicra(10)">+ Earn 10</button>
    <button onclick="spendLicra(5)">- Spend 5</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
